<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mentor Debrief · nxT Innovation Lab</title>
<meta name="description" content="Monthly mentor debrief for nxT Innovation Lab leaders — evaluate your intern, rate the program, and unlock your mentor archetype.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--card:#ffffff;--card-br:#e2e8f0;
  --txt:#0f172a;--muted:#64748b;--accent:#7c3aed;--accent-soft:#f3e8ff;--accent2:#0284c7;--accent2-soft:#e0f2fe;
  --green:#059669;--pink:#db2777;
  --grad:linear-gradient(90deg,#8b5cf6,#0ea5e9,#10b981);
  --radius:18px;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);
  min-height:100vh;line-height:1.55;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(139,92,246,.08),transparent),
                   radial-gradient(700px 500px at -10% 30%,rgba(14,165,233,.06),transparent),
                   radial-gradient(800px 600px at 50% 110%,rgba(16,185,129,.05),transparent);
  background-attachment:fixed;
}
h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:20px 18px 90px}
.ic{vertical-align:-0.22em;flex-shrink:0}
.hud{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--card-br);padding:10px 18px}
.hud-inner{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;font-size:.95rem;letter-spacing:.02em;white-space:nowrap}
.brand span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{flex:1;height:10px;border-radius:99px;background:#eef2f7;overflow:hidden}
.bar i{display:block;height:100%;width:0%;background:var(--grad);border-radius:99px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.xp{font-family:'Space Grotesk';font-weight:700;font-size:.85rem;color:var(--green);white-space:nowrap;min-width:74px;text-align:right}
.lvl{font-size:.7rem;color:var(--muted);display:block;text-align:right;margin-top:-2px}
.screen{display:none;animation:pop .45s cubic-bezier(.22,1,.36,1)}
.screen.active{display:block}
@keyframes pop{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--card-br);border-radius:var(--radius);padding:22px;margin:16px 0;box-shadow:var(--shadow)}
.chapter-tag{display:inline-flex;align-items:center;gap:7px;font-family:'Space Grotesk';font-size:.75rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
  border:1px solid #ddd6fe;padding:5px 12px;border-radius:99px;margin-bottom:12px}
h1{font-size:2rem;line-height:1.15;margin-bottom:10px}
h2{font-size:1.45rem;line-height:1.2;margin-bottom:6px;display:flex;align-items:center;gap:10px}
h2 .ic{color:var(--accent)}
h3{font-size:1.02rem;margin-bottom:6px;display:flex;align-items:center;gap:8px}
h3 .ic{color:var(--accent2)}
.sub{color:var(--muted);font-size:.95rem}
.q{margin:22px 0}
.q-label{font-weight:600;margin-bottom:4px;display:block}
.q-hint{font-size:.82rem;color:var(--muted);margin-bottom:10px;display:block}
.optional{font-size:.7rem;color:var(--muted);font-weight:500;border:1px solid var(--card-br);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}
input[type=text],input[type=email],input[type=url],input[type=month],textarea,select{
  width:100%;background:#f8fafc;border:1px solid #cbd5e1;color:var(--txt);
  border-radius:12px;padding:12px 14px;font-size:.95rem;font-family:inherit;outline:none;transition:border .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.12);background:#fff}
textarea{min-height:88px;resize:vertical}
::placeholder{color:#94a3b8}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #cbd5e1;background:#fff;color:var(--txt);
  border-radius:99px;padding:8px 14px;font-size:.87rem;cursor:pointer;transition:all .15s;font-family:inherit;user-select:none}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:#5b21b6;font-weight:600}
.emoji-row{display:flex;gap:6px;justify-content:space-between}
.emoji-btn{flex:1;background:#fff;border:1px solid #cbd5e1;border-radius:14px;
  padding:10px 0 6px;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit}
.emoji-btn .e{display:block;color:#94a3b8;transition:all .15s;line-height:1}
.emoji-btn small{font-size:.62rem;color:var(--muted)}
.emoji-btn:hover .e{color:var(--face);transform:scale(1.12)}
.emoji-btn.on{background:var(--accent2-soft);border-color:var(--accent2)}
.emoji-btn.on .e{color:var(--face);transform:scale(1.15)}
.rate-row{padding:14px 0;border-bottom:1px solid #eef2f7}
.rate-row:last-child{border-bottom:none}
.rate-row .rlabel{font-weight:600;font-size:.93rem;margin-bottom:2px}
.rate-row .rdesc{font-size:.8rem;color:var(--muted);margin-bottom:10px}
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
.nps button{aspect-ratio:1;border-radius:10px;border:1px solid #cbd5e1;background:#fff;
  color:var(--txt);font-family:'Space Grotesk';font-weight:700;font-size:.9rem;cursor:pointer;transition:all .15s}
.nps button:hover{border-color:var(--accent)}
.nps button.on{background:var(--grad);color:#fff;border-color:transparent;transform:scale(1.12)}
.nps-legend{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:6px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.levels button{background:#fff;border:1px solid #cbd5e1;border-radius:14px;padding:10px 6px;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center}
.levels button b{display:block;font-family:'Space Grotesk';font-size:.9rem;color:var(--txt)}
.levels button small{font-size:.66rem;color:var(--muted)}
.levels button:hover{border-color:var(--accent);transform:translateY(-2px)}
.levels button.on{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-2px)}
.levels button.on b{color:#5b21b6}
@media(max-width:420px){.levels{grid-template-columns:repeat(2,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;
  padding:14px 26px;font-family:'Space Grotesk';font-weight:700;font-size:1rem;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,58,237,.4)}
.btn-ghost{background:#fff;color:var(--muted);border:1px solid var(--card-br)}
.btn-ghost:hover{color:var(--txt);border-color:#94a3b8}
.nav-row{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);z-index:99;
  background:#fff;border:1px solid var(--card-br);border-radius:16px;padding:12px 20px;
  display:flex;align-items:center;gap:12px;box-shadow:0 12px 40px rgba(15,23,42,.18);transition:transform .45s cubic-bezier(.22,1,.36,1)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast .t-icon{color:var(--accent);display:flex}
#toast b{display:block;font-family:'Space Grotesk';font-size:.9rem}
#toast small{color:var(--muted);font-size:.78rem}
.hero{text-align:center;padding:34px 10px 10px}
.hero .big-emoji{font-size:3.6rem;display:block;margin-bottom:12px;animation:float 3s ease-in-out infinite}
.hero .big-icon{display:inline-flex;color:var(--accent);margin-bottom:12px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.pill-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.pill{font-size:.78rem;border:1px solid var(--card-br);border-radius:99px;padding:5px 12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;background:#fff}
.pill .ic{color:var(--accent)}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin:18px 0}
.badge{background:#f8fafc;border:1px solid var(--card-br);border-radius:14px;padding:14px 6px;text-align:center}
.badge .be{display:flex;justify-content:center;color:#cbd5e1}
.badge.won{background:#fff;border-color:#bae6fd}
.badge.won .be{color:var(--accent2)}
.badge small{font-size:.64rem;color:var(--muted);display:block;margin-top:6px}
.badge.won small{color:var(--txt);font-weight:600}
.archetype{background:linear-gradient(135deg,rgba(139,92,246,.08),rgba(14,165,233,.07),rgba(16,185,129,.06));
  border:1px solid #ddd6fe;border-radius:20px;padding:26px;text-align:center;margin:18px 0}
.archetype .a-icon{display:flex;justify-content:center;color:var(--accent);margin-bottom:10px}
.archetype h3{font-size:1.4rem;justify-content:center;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:98}
.error-note{background:#fdf2f8;border:1px solid #fbcfe8;border-radius:12px;padding:12px 14px;font-size:.85rem;margin-top:14px;display:none;color:#9d174d}
.error-note a{color:var(--accent2)}
@media(max-width:520px){
  h1{font-size:1.6rem}
  .nps button{font-size:.75rem;border-radius:8px}
  .card{padding:16px}
}
</style>
</head>
<body>

<div class="hud">
  <div class="hud-inner">
    <div class="brand">nxT <span>Mentor Debrief</span></div>
    <div class="bar"><i id="bar-fill"></i></div>
    <div>
      <div class="xp" id="xp">0 XP</div>
      <span class="lvl" id="lvl">Scout</span>
    </div>
  </div>
</div>

<div class="wrap" id="app"></div>

<div id="toast"><span class="t-icon" id="toast-icon"></span><div><b id="toast-title"></b><small id="toast-sub"></small></div></div>
<canvas id="confetti"></canvas>

<script>
/* ================= ICONS ================= */
const ICONS = {

  briefcase:'<rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',

function I(name, size=20){
  return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||''}</svg>`;
}

/* ================= STATE ================= */
const S = JSON.parse(localStorage.getItem('nxt-leader-debrief') || '{}');
S.ratings = S.ratings || {};
S.programRatings = S.programRatings || {};
let xp = S._xp || 0, screenIdx = S._screen || 0;
const answered = new Set(S._answered || []);
const badges = new Set(S._badges || []);

const LEVELS = [[0,'Scout'],[70,'Mentor'],[150,'Coach'],[250,'Captain'],[360,'Commander'],[480,'nxT Legend']];
const TOTAL_XP_EST = 540;

function save(){
  S._xp = xp; S._screen = screenIdx; S._answered = [...answered]; S._badges = [...badges];
  localStorage.setItem('nxt-leader-debrief', JSON.stringify(S));
}
function gain(key, amount){
  if(answered.has(key)) return;
  answered.add(key); xp += amount; renderHUD(); save();
}
function renderHUD(){
  document.getElementById('xp').textContent = xp + ' XP';
  document.getElementById('bar-fill').style.width = Math.min(100, xp/TOTAL_XP_EST*100) + '%';
  let name = LEVELS[0][1];
  for(const [min,n] of LEVELS) if(xp >= min) name = n;
  const el = document.getElementById('lvl');
  if(el.textContent !== name && xp > 0){ el.textContent = name; toast('trendup','Level up!','You are now: ' + name); }
  else el.textContent = name;
}

/* ================= HELPERS ================= */
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function chipGroup(key, options, multi, xpAmount=15){
  const c = el(`<div class="chips" role="group"></div>`);
  const sel = new Set(S[key] || (multi ? [] : (S[key] ? [S[key]] : [])));
  options.forEach(opt=>{
    const b = el(`<button type="button" class="chip${sel.has(opt)?' on':''}">${opt}</button>`);
    b.onclick = ()=>{
      if(multi){
        b.classList.toggle('on');
        b.classList.contains('on') ? sel.add(opt) : sel.delete(opt);
        S[key] = [...sel];
      } else {
        c.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
        b.classList.add('on'); S[key] = opt;
      }
      gain(key, xpAmount); save();
    };
    c.appendChild(b);
  });
  return c;
}
function faceScale(store, key, xpAmount=15){
  const row = el(`<div class="emoji-row" role="radiogroup"></div>`);
  FACES.forEach(([icon,label,color],i)=>{
    const v = i+1;
    const b = el(`<button type="button" class="emoji-btn${store[key]===v?' on':''}" style="--face:${color}"><span class="e">${I(icon,26)}</span><small>${label}</small></button>`);
    b.onclick = ()=>{
      row.querySelectorAll('.emoji-btn').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); store[key]=v; gain('r_'+key, xpAmount); save();
    };
    row.appendChild(b);
  });
  return row;
}
function ratingBlock(items, store){
  const wrap = document.createElement('div');
  items.forEach(([key,label,desc])=>{
    const r = el(`<div class="rate-row"><div class="rlabel">${label}</div><div class="rdesc">${desc}</div></div>`);
    r.appendChild(faceScale(store, key));
    wrap.appendChild(r);
  });
  return wrap;
}
function textInput(key, placeholder, type='text', xpAmount=15){
  const i = el(`<input type="${type}" placeholder="${placeholder}">`);
  i.value = S[key] || '';
  i.oninput = ()=>{ S[key]=i.value; save(); };
  i.onblur = ()=>{ if(i.value.trim()) gain(key, xpAmount); };
  return i;
}
function textArea(key, placeholder, xpAmount=20){
  const i = el(`<textarea placeholder="${placeholder}"></textarea>`);
  i.value = S[key] || '';
  i.oninput = ()=>{ S[key]=i.value; save(); };
  i.onblur = ()=>{ if(i.value.trim()) gain(key, xpAmount); };
  return i;
}
function q(labelHtml, hint, node, optional=true){
  const w = el(`<div class="q"><span class="q-label">${labelHtml}${optional?'<span class="optional">optional</span>':''}</span>${hint?`<span class="q-hint">${hint}</span>`:''}</div>`);
  w.appendChild(node);
  return w;
}

async function submit(){
  const btn = document.getElementById('submit');
  const err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Transmitting…';
  const payload = {
    formType:'leader',
    accessCode:S.accessCode||null,
    month:S.month||null, phase:S.month ? (S.month<=3?'learning':'paid') : null,
    leaderName:S.leaderName||null, internName:S.internName||null, area:S.area||null, hat:S.hat||null,
    areas:S.areas||[], mission:S.mission||null, stepForward:S.stepForward||null,
    ratings:S.ratings, programRatings:S.programRatings,
    standout:S.standout||null, impressed:S.impressed||null,
    skillsGrown:S.skillsGrown||[], growthFocus:S.growthFocus||[], growthNotes:S.growthNotes||null,
    keep:S.keep||null, fix:S.fix||null,
    paidRecommendation:S.paidRecommendation||null, finalRecommendation:S.finalRecommendation||null,
    anotherIntern:S.anotherIntern||null, nextFocus:S.nextFocus||null, supportNeeded:S.supportNeeded||null,
    nps:S.nps??null, xp, badges:[...badges], archetype:S.hat||null
  };
  try{
    const r = await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!r.ok){
      let msg = 'HTTP '+r.status;
      try{ msg = (await r.json()).error || msg; }catch(_){}
      throw new Error(r.status===403 ? 'CODE:'+msg : msg);
    }
    btn.innerHTML = 'Received — thank you! ' + I('sparkles',18);
    confettiBurst(); confettiBurst();
    toast('send','Evaluation transmitted','Thank you for the honest read.');
    localStorage.removeItem('nxt-leader-debrief');
    err.style.display='none';
  }catch(e){
    const codeProblem = String(e.message||'').startsWith('CODE:');
    btn.disabled = false; btn.innerHTML = 'Try again ' + I('send',18);
    err.style.display='block';
    err.innerHTML = codeProblem
      ? e.message.slice(5) + '. Ask the program admin for a fresh code — your answers are saved on this device, so nothing is lost.'
      : 'Hmm, transmission failed. Your answers are still saved on this device — try again in a moment.';
  }
}

/* ================= CONFETTI ================= */
function confettiBurst(){
  const cv = document.getElementById('confetti');
  const ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ['#8b5cf6','#0ea5e9','#10b981','#f59e0b','#ec4899'];
  const parts = Array.from({length:120},()=>({
    x: innerWidth/2 + (Math.random()-.5)*200, y: innerHeight*0.35,
    vx:(Math.random()-.5)*14, vy:-Math.random()*14-4,
    s: Math.random()*7+4, c: colors[Math.floor(Math.random()*colors.length)],
    r: Math.random()*Math.PI, vr:(Math.random()-.5)*.3, life: 1
  }));
  let frame = 0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=.35; p.r+=p.vr; p.life-=.008;
      ctx.save(); ctx.globalAlpha=Math.max(0,p.life); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); ctx.restore();
    });
    if(++frame<160) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

render();
