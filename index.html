<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Debrief · nxT Innovation Lab</title>
<meta name="description" content="Post-internship mission debrief for nxT Innovation Lab — rate your journey, show off what you built, and unlock your intern archetype.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--card:#ffffff;--card-br:#e2e8f0;
  --txt:#0f172a;--muted:#64748b;--accent:#0284c7;--accent-soft:#e0f2fe;--accent2:#7c3aed;--accent2-soft:#f3e8ff;
  --green:#059669;--pink:#db2777;
  --grad:linear-gradient(90deg,#0ea5e9,#8b5cf6,#ec4899);
  --radius:18px;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);
  min-height:100vh;line-height:1.55;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(14,165,233,.07),transparent),
                   radial-gradient(700px 500px at -10% 30%,rgba(139,92,246,.06),transparent),
                   radial-gradient(800px 600px at 50% 110%,rgba(236,72,153,.05),transparent);
  background-attachment:fixed;
}
h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:20px 18px 90px}
.ic{vertical-align:-0.22em;flex-shrink:0}
/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--card-br);padding:10px 18px}
.hud-inner{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;font-size:.95rem;letter-spacing:.02em;white-space:nowrap}
.brand span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{flex:1;height:10px;border-radius:99px;background:#eef2f7;overflow:hidden}
.bar i{display:block;height:100%;width:0%;background:var(--grad);border-radius:99px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.xp{font-family:'Space Grotesk';font-weight:700;font-size:.85rem;color:var(--green);white-space:nowrap;min-width:74px;text-align:right}
.lvl{font-size:.7rem;color:var(--muted);display:block;text-align:right;margin-top:-2px}
/* ---------- Cards / screens ---------- */
.screen{display:none;animation:pop .45s cubic-bezier(.22,1,.36,1)}
.screen.active{display:block}
@keyframes pop{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--card-br);border-radius:var(--radius);padding:22px;margin:16px 0;box-shadow:var(--shadow)}
.chapter-tag{display:inline-flex;align-items:center;gap:7px;font-family:'Space Grotesk';font-size:.75rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
  border:1px solid #bae6fd;padding:5px 12px;border-radius:99px;margin-bottom:12px}
h1{font-size:2rem;line-height:1.15;margin-bottom:10px}
h2{font-size:1.45rem;line-height:1.2;margin-bottom:6px;display:flex;align-items:center;gap:10px}
h2 .ic{color:var(--accent2)}
h3{font-size:1.02rem;margin-bottom:6px;display:flex;align-items:center;gap:8px}
h3 .ic{color:var(--accent)}
.sub{color:var(--muted);font-size:.95rem}
.q{margin:22px 0}
.q-label{font-weight:600;margin-bottom:4px;display:block}
.q-hint{font-size:.82rem;color:var(--muted);margin-bottom:10px;display:block}
.optional{font-size:.7rem;color:var(--muted);font-weight:500;border:1px solid var(--card-br);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}
/* ---------- Inputs ---------- */
input[type=text],input[type=email],input[type=url],input[type=month],textarea,select{
  width:100%;background:#f8fafc;border:1px solid #cbd5e1;color:var(--txt);
  border-radius:12px;padding:12px 14px;font-size:.95rem;font-family:inherit;outline:none;transition:border .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(2,132,199,.12);background:#fff}
textarea{min-height:88px;resize:vertical}
::placeholder{color:#94a3b8}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #cbd5e1;background:#fff;color:var(--txt);
  border-radius:99px;padding:8px 14px;font-size:.87rem;cursor:pointer;transition:all .15s;font-family:inherit;user-select:none}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:#075985;font-weight:600}
/* face scale */
.emoji-row{display:flex;gap:6px;justify-content:space-between}
.emoji-btn{flex:1;background:#fff;border:1px solid #cbd5e1;border-radius:14px;
  padding:10px 0 6px;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit}
.emoji-btn .e{display:block;color:#94a3b8;transition:all .15s;line-height:1}
.emoji-btn small{font-size:.62rem;color:var(--muted)}
.emoji-btn:hover .e{color:var(--face);transform:scale(1.12)}
.emoji-btn.on{background:var(--accent2-soft);border-color:var(--accent2)}
.emoji-btn.on .e{color:var(--face);transform:scale(1.15)}
/* rating grid rows */
.rate-row{padding:14px 0;border-bottom:1px solid #eef2f7}
.rate-row:last-child{border-bottom:none}
.rate-row .rlabel{font-weight:600;font-size:.93rem;margin-bottom:2px}
.rate-row .rdesc{font-size:.8rem;color:var(--muted);margin-bottom:10px}
/* nps */
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
.nps button{aspect-ratio:1;border-radius:10px;border:1px solid #cbd5e1;background:#fff;
  color:var(--txt);font-family:'Space Grotesk';font-weight:700;font-size:.9rem;cursor:pointer;transition:all .15s}
.nps button:hover{border-color:var(--accent)}
.nps button.on{background:var(--grad);color:#fff;border-color:transparent;transform:scale(1.12)}
.nps-legend{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:6px}
/* sliders (then vs now) */
.slider-pair{margin:16px 0}
.slider-pair .sp-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.slider-pair .sp-head b{font-size:.92rem}
.slider-line{display:flex;align-items:center;gap:10px;margin:6px 0}
.slider-line label{font-size:.75rem;color:var(--muted);width:52px;flex-shrink:0}
.slider-line output{font-family:'Space Grotesk';font-weight:700;width:26px;text-align:center;color:var(--green)}
input[type=range]{flex:1;accent-color:#7c3aed;height:22px}
.delta{font-size:.75rem;color:var(--green);font-weight:600;display:inline-flex;align-items:center;gap:4px}
/* project cards */
.proj{border:1px dashed #cbd5e1;border-radius:14px;padding:16px;margin:12px 0;position:relative;background:#fbfcfe}
.proj .del{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem}
.proj .del:hover{color:var(--pink)}
.proj input,.proj textarea{margin-bottom:10px}
.add-btn{width:100%;padding:13px;border-radius:14px;border:1px dashed #94a3b8;background:transparent;
  color:var(--accent);font-weight:600;font-size:.92rem;cursor:pointer;font-family:inherit;transition:all .15s}
.add-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
/* buttons / nav */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;
  padding:14px 26px;font-family:'Space Grotesk';font-weight:700;font-size:1rem;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(139,92,246,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(139,92,246,.4)}
.btn-ghost{background:#fff;color:var(--muted);border:1px solid var(--card-br)}
.btn-ghost:hover{color:var(--txt);border-color:#94a3b8}
.nav-row{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
/* avatar picker */
.avatars{display:flex;flex-wrap:wrap;gap:8px}
.avatars button{background:#fff;border:1px solid #cbd5e1;color:#475569;
  border-radius:14px;width:54px;height:54px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center}
.avatars button:hover{transform:scale(1.1);border-color:var(--accent)}
.avatars button.on{border-color:var(--green);background:#ecfdf5;color:var(--green);transform:scale(1.12)}
/* month / level select */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.levels button{background:#fff;border:1px solid #cbd5e1;border-radius:14px;padding:10px 6px;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center}
.levels button b{display:block;font-family:'Space Grotesk';font-size:.9rem;color:var(--txt)}
.levels button small{font-size:.66rem;color:var(--muted)}
.levels button:hover{border-color:var(--accent);transform:translateY(-2px)}
.levels button.on{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-2px)}
.levels button.on b{color:#075985}
@media(max-width:420px){.levels{grid-template-columns:repeat(2,1fr)}}
/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);z-index:99;
  background:#fff;border:1px solid var(--card-br);border-radius:16px;padding:12px 20px;
  display:flex;align-items:center;gap:12px;box-shadow:0 12px 40px rgba(15,23,42,.18);transition:transform .45s cubic-bezier(.22,1,.36,1)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast .t-icon{color:var(--accent2);display:flex}
#toast b{display:block;font-family:'Space Grotesk';font-size:.9rem}
#toast small{color:var(--muted);font-size:.78rem}
/* hero / finale */
.hero{text-align:center;padding:34px 10px 10px}
.hero .big-emoji{font-size:3.6rem;display:block;margin-bottom:12px;animation:float 3s ease-in-out infinite}
.hero .big-icon{display:inline-flex;color:var(--accent2);margin-bottom:12px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.pill-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.pill{font-size:.78rem;border:1px solid var(--card-br);border-radius:99px;padding:5px 12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;background:#fff}
.pill .ic{color:var(--accent)}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin:18px 0}
.badge{background:#f8fafc;border:1px solid var(--card-br);border-radius:14px;padding:14px 6px;text-align:center}
.badge .be{display:flex;justify-content:center;color:#cbd5e1}
.badge.won{background:#fff;border-color:#ddd6fe}
.badge.won .be{color:var(--accent2)}
.badge small{font-size:.64rem;color:var(--muted);display:block;margin-top:6px}
.badge.won small{color:var(--txt);font-weight:600}
.archetype{background:linear-gradient(135deg,rgba(14,165,233,.07),rgba(139,92,246,.08),rgba(236,72,153,.06));
  border:1px solid #ddd6fe;border-radius:20px;padding:26px;text-align:center;margin:18px 0}
.archetype .a-icon{display:flex;justify-content:center;color:var(--accent2);margin-bottom:10px}
.archetype h3{font-size:1.4rem;justify-content:center;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:98}
.error-note{background:#fdf2f8;border:1px solid #fbcfe8;border-radius:12px;padding:12px 14px;font-size:.85rem;margin-top:14px;display:none;color:#9d174d}
.error-note a{color:var(--accent)}
.checkbox-line{display:flex;gap:10px;align-items:flex-start;font-size:.87rem;color:var(--muted);margin-top:10px;cursor:pointer}
.checkbox-line input{width:18px;height:18px;margin-top:2px;accent-color:#0284c7;flex-shrink:0}
@media(max-width:520px){
  h1{font-size:1.6rem}
  .nps button{font-size:.75rem;border-radius:8px}
  .card{padding:16px}
}
</style>
</head>

const badges = new Set(S._badges || []);

const LEVELS = [[0,'Explorer'],[80,'Builder'],[180,'Creator'],[300,'Innovator'],[430,'Trailblazer'],[560,'nxT Legend']];
const TOTAL_XP_EST = 640;

function save(){
  S._xp = xp; S._screen = screenIdx; S._answered = [...answered]; S._badges = [...badges];
  localStorage.setItem('nxt-debrief', JSON.stringify(S));
}
function gain(key, amount){
  if(answered.has(key)) return;
  answered.add(key); xp += amount; renderHUD(); save();
}
function renderHUD(){
  document.getElementById('xp').textContent = xp + ' XP';
  document.getElementById('bar-fill').style.width = Math.min(100, xp/TOTAL_XP_EST*100) + '%';
  let name = LEVELS[0][1];
  for(const [min,n] of LEVELS) if(xp >= min) name = n;
  const el = document.getElementById('lvl');
  if(el.textContent !== name && xp > 0){ el.textContent = name; toast('arrowup','Level up!','You are now: ' + name); }
  else el.textContent = name;
}
let toastTimer;
function toast(iconName, title, sub){
  const t = document.getElementById('toast');
  document.getElementById('toast-icon').innerHTML = I(iconName, 28);
  document.getElementById('toast-title').textContent = title;
  document.getElementById('toast-sub').textContent = sub;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}
function awardBadge(id, iconName, name){
  if(badges.has(id)) return;
  badges.add(id); toast(iconName, 'Badge unlocked: ' + name, 'Added to your trophy shelf'); save();
}

/* ================= RENDER HELPERS ================= */
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

function chipGroup(key, options, multi, xpAmount=15){
  const c = el(`<div class="chips" role="group"></div>`);
  const sel = new Set(S[key] || (multi ? [] : (S[key] ? [S[key]] : [])));
  options.forEach(opt=>{
    const b = el(`<button type="button" class="chip${sel.has(opt)?' on':''}">${opt}</button>`);
    b.onclick = ()=>{
      if(multi){
        b.classList.toggle('on');
        b.classList.contains('on') ? sel.add(opt) : sel.delete(opt);
        S[key] = [...sel];
      } else {
        c.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
        b.classList.add('on'); S[key] = opt;
      }
      gain(key, xpAmount); save();
    };
    c.appendChild(b);
  });
  return c;
}

function emojiScale(key, xpAmount=15){
  const row = el(`<div class="emoji-row" role="radiogroup"></div>`);
  FACES.forEach(([icon,label,color],i)=>{
    const v = i+1;
    const b = el(`<button type="button" class="emoji-btn${S.ratings[key]===v?' on':''}" style="--face:${color}"><span class="e">${I(icon,26)}</span><small>${label}</small></button>`);
    b.onclick = ()=>{
      row.querySelectorAll('.emoji-btn').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); S.ratings[key]=v; gain('r_'+key, xpAmount); save();
    };
    row.appendChild(b);
  });
  return row;
}

function ratingBlock(items){
  const wrap = document.createElement('div');
  items.forEach(([key,label,desc])=>{
    const r = el(`<div class="rate-row"><div class="rlabel">${label}</div><div class="rdesc">${desc}</div></div>`);
    r.appendChild(emojiScale(key));
    wrap.appendChild(r);
  });
  return wrap;
}

function textInput(key, placeholder, type='text', xpAmount=15){
  const i = el(`<input type="${type}" placeholder="${placeholder}">`);
  i.value = S[key] || '';
  i.oninput = ()=>{ S[key]=i.value; save(); };
  i.onblur = ()=>{ if(i.value.trim()) gain(key, xpAmount); };
  return i;
}
function textArea(key, placeholder, xpAmount=20){
  const i = el(`<textarea placeholder="${placeholder}"></textarea>`);
  i.value = S[key] || '';
  i.oninput = ()=>{ S[key]=i.value; save(); };
  i.onblur = ()=>{ if(i.value.trim()) gain(key, xpAmount); };
  return i;
}
function q(labelHtml, hint, node, optional=true){
  const w = el(`<div class="q"><span class="q-label">${labelHtml}${optional?'<span class="optional">optional</span>':''}</span>${hint?`<span class="q-hint">${hint}</span>`:''}</div>`);
  w.appendChild(node);
  return w;
}

/* --- 5 · What's next --- */
screens.push(()=>{
  const m5 = S.month || 6;
  const final = m5 === 6;
  const head5 = {
    1:'Setting up month 2',
    2:'Setting up month 3',
    3:'Leveling up: the paid phase',
    4:'Setting up month 5',
    5:'Setting up the finale',
    6:'What happens next?'
  }[m5];
  const sub5 = {
    1:'One month in — tell us what would make month 2 land even better. Then your archetype awaits.',
    2:'One more month of the learning phase to go. Point it in the right direction — then your archetype awaits.',
    3:'Next month you go paid — real stakes, real money. A few answers to start it right, then your archetype awaits.',
    4:'You\'re paid now, and the bar keeps rising. Shape month 5 — then your archetype awaits.',
    5:'One month left. Make the finale count — then your archetype awaits.',
    6:'The internship can lead to part-time or full-time roles. Last honest answers — then your archetype awaits.'
  }[m5];
  const s = el(`<section class="screen">
    <span class="chapter-tag">${I('star',14)} Chapter 5 · ${final?'New game +':'Next level'}</span>
    <h2>${I('star',24)} ${head5}</h2>
    <p class="sub">${sub5}</p>
    <div class="card" id="c5"></div>
    <div class="nav-row"><button class="btn btn-ghost" data-back>← Back</button><button class="btn btn-primary" id="finish">Finish &amp; reveal my archetype ${I('gift',18)}</button></div>
  </section>`);
  const c = s.querySelector('#c5');
  if(final) c.appendChild(q('Would you want to keep going with nxT?','', chipGroup('continue',['Full-time, sign me up','Part-time works for me','Freelance / per-project','Maybe later — keep in touch','This chapter is complete for me'], false, 20), false));
  if(!final){
    c.appendChild(q(m5===3?'What do you want more of in the paid phase?':'What do you want more of next month?','Tap all that apply.', chipGroup('wantMore',['More real projects','More mentoring time','More feedback','More workshops & training','More client / partner exposure','More creative freedom','More technical challenges','More team time'], true, 20), false));
    c.appendChild(q(m5===3?'Your #1 goal for the paid phase':`Your #1 goal for month ${m5+1}`,'One thing you want to be true by the next debrief.', textInput('nextGoal', m5===3?'e.g. Own a real project end-to-end now that it counts':'e.g. Ship my first feature end-to-end without hand-holding')));
    if(m5===3) c.appendChild(q('Anything on your mind about going paid?','Worries, questions, expectations — say it now so month 4 starts right.', textArea('transitionNotes','e.g. I want to make sure my hours fit around classes…')));
    if(m5===5) c.appendChild(q('Starting to think about life after the internship?','No pressure — this just helps nxT plan ahead.', chipGroup('continue',['Full-time, sign me up','Part-time works for me','Freelance / per-project','Maybe later — keep in touch','Too early to tell'], false, 20)));
  }
  c.appendChild(q('How likely are you to recommend this internship to a friend?','', (()=>{
    const w = document.createElement('div');
    const n = el(`<div class="nps"></div>`);
    for(let i=0;i<=10;i++){
      const b = el(`<button type="button"${S.nps===i?' class="on"':''}>${i}</button>`);
      b.onclick = ()=>{ n.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); S.nps=i; gain('nps',20); save(); };
      n.appendChild(b);
    }
    w.appendChild(n);
    w.appendChild(el(`<div class="nps-legend"><span>Not a chance</span><span>Take my friends</span></div>`));
    return w;
  })(), false));
  c.appendChild(q('One thing nxT should <b>keep doing</b>','', textArea('keep','The thing that worked this month — don\'t let them change it.')));
  c.appendChild(q('One thing nxT should <b>fix or change</b>','Be blunt. This goes straight to the people who can change it.', textArea('fix','If you ran the program, what would you do differently?')));
  if(final){
    c.appendChild(q('Your advice to the next intern','One sentence they\'ll read on their first day.', textInput('advice','e.g. Ask the "dumb" question on day one — it saves you a month.')));
    c.appendChild(q('A testimonial we could share','', textArea('testimonial','A few words about your experience, in your voice…')));
    c.appendChild((()=>{
      const l = el(`<label class="checkbox-line"><input type="checkbox" ${S.testimonialOk?'checked':''}><span>You can share my testimonial (and first name, if I gave it) publicly — website, social, recruiting.</span></label>`);
      l.querySelector('input').onchange = e=>{ S.testimonialOk = e.target.checked; save(); };
      return l;
    })());
  }
  s.querySelector('#finish').onclick = finish;
  return s;
});

/* --- 6 · Finale --- */
screens.push(()=>{
  const arch = pickArchetype();
  const growth = totalGrowth();
  const nProj = S.projects.filter(p=>p.title).length;
  const m6 = S.month || 6;
  const s = el(`<section class="screen">
    <div class="hero">
      <span class="big-icon">${I(S.avatar || 'trophy', 64)}</span>
      <h1>${m6===6?'Mission complete':m6===3?'Learning phase complete':'Month '+m6+' complete'}${S.name ? ', ' + S.name.split(' ')[0] : ''}!</h1>
      <p class="sub">${m6===6?'Six months.':m6===3?'Levels 1–3 cleared — you\'ve unlocked the paid phase '+I('briefcase',15)+'.':'Level '+m6+' of 6 cleared.'} ${nProj || 'Your'} project${nProj===1?'':'s'} showcased. ${growth>0? '+'+growth+' total skill points of growth.' : 'A whole lot of growth.'}${m6<6?' See you at the month '+(m6+1)+' debrief.':''}</p>
    </div>
    <div class="archetype">
      <span class="a-icon">${I(arch[0], 52)}</span>
      <h3>${arch[1]}</h3>
      <p class="sub" style="margin-top:6px">${arch[2]}</p>
    </div>
    <div class="card">
      <h3>${I('trophy',18)} Trophy shelf</h3>
      <div class="badge-grid" id="shelf"></div>
      <p class="sub" style="text-align:center;font-family:'Space Grotesk';font-weight:700;color:var(--green)" id="final-xp"></p>
    </div>
    <div class="nav-row">
      <button class="btn btn-ghost" data-back>← Edit answers</button>
      <button class="btn btn-primary" id="submit">Submit my debrief ${I('send',18)}</button>
    </div>
    <div class="error-note" id="err"></div>
  </section>`);
  const ALL_BADGES = [['b0','clapper','Origin Story'],['b1','compass','Pathfinder'],['b2','swords','Honest Critic'],['b3','mic','Show & Tell'],['b4','flame','Impact Maker'],['b5','star','Future Builder']];
  const shelf = s.querySelector('#shelf');
  ALL_BADGES.forEach(([id,ic,n])=>{
    shelf.appendChild(el(`<div class="badge${badges.has(id)?' won':''}"><span class="be">${I(ic,28)}</span><small>${n}</small></div>`));
  });
  s.querySelector('#final-xp').textContent = xp + ' XP · ' + document.getElementById('lvl').textContent;
  s.querySelector('#submit').onclick = submit;
  return s;
});

function pickArchetype(){
  const sk = (S.skills||[]).join(' ').toLowerCase();
  const score = {build:0,create:0,data:0,people:0};
  [['build',['development','code','no-code','engineering','ai & prompt']],
   ['create',['design','video','media','ux','speaking']],
   ['data',['data','research','analysis']],
   ['people',['community','teaching','outreach','facilitation','sales','management']]
  ].forEach(([k,words])=> words.forEach(w=>{ if(sk.includes(w)) score[k]++; }));
  const best = Object.entries(score).sort((a,b)=>b[1]-a[1])[0];
  return (!best || best[1]===0 || (S.areas||[]).length >= 4) && (S.areas||[]).length >= 4
    ? ARCHETYPES.explore
    : (best && best[1] > 0 ? ARCHETYPES[best[0]] : ARCHETYPES.explore);
}
function totalGrowth(){
  return Object.values(S.skillsThenNow).reduce((t,v)=> t + Math.max(0,(v.now||0)-(v.then||0)), 0);
}

/* ================= NAV ================= */
function go(i){
  if(i===2) awardBadge('b1','compass','Pathfinder');
  if(i===3) awardBadge('b2','swords','Honest Critic');
  if(i===4 && S.projects.some(p=>p.title)) awardBadge('b3','mic','Show & Tell');
  if(i===5) awardBadge('b4','flame','Impact Maker');
  screenIdx = i; save(); render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function finish(){
  awardBadge('b5','star','Future Builder');
  go(6);
  setTimeout(confettiBurst, 400);
}
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const s = screens[screenIdx]();
  s.classList.add('active');
  app.appendChild(s);
  s.querySelectorAll('[data-back]').forEach(b=> b.onclick = ()=> go(screenIdx-1));
  s.querySelectorAll('[data-next]').forEach(b=> b.onclick = ()=> go(screenIdx+1));
  renderHUD();
}

/* ================= SUBMIT ================= */
async function submit(){
  const btn = document.getElementById('submit');
  const err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Transmitting…';
  const payload = {
    month:S.month||null, phase:S.month ? (S.month<=3?'learning':'paid') : null,
    name:S.name||null, email:S.email||null, avatar:S.avatar||null, cohort:S.cohort||null,
    areas:S.areas||[], favoriteArea:S.favoriteArea||null, mission:S.mission||null, surprise:S.surprise||null,
    ratings:S.ratings, skills:S.skills||[], unlocked:S.unlocked||null,
    projects:S.projects.filter(p=>p.title||p.what), skillsThenNow:S.skillsThenNow,
    contribution:S.contribution||null, metric:S.metric||null, beneficiary:S.beneficiary||[],
    moment:S.moment||null, continueInterest:S.continue||null, nps:S.nps??null,
    keep:S.keep||null, fix:S.fix||null, advice:S.advice||null,
    wantMore:S.wantMore||[], nextGoal:S.nextGoal||null, transitionNotes:S.transitionNotes||null,
    testimonial:S.testimonial||null, testimonialOk:!!S.testimonialOk,
    xp, badges:[...badges], archetype:pickArchetype()[1]
  };
  try{
    const r = await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!r.ok) throw new Error('HTTP '+r.status);
    btn.innerHTML = 'Received — thank you! ' + I('sparkles',18);
    confettiBurst(); confettiBurst();
    toast('send','Debrief transmitted','Thank you for 6 months of awesome.');
    localStorage.removeItem('nxt-debrief');
    err.style.display='none';
  }catch(e){
    btn.disabled = false; btn.innerHTML = 'Try again ' + I('send',18);
    err.style.display='block';
    err.innerHTML = 'Hmm, transmission failed. Your answers are still saved on this device — try again in a moment, or <a href="#" id="dl">download your answers</a> and email them to the team.';
    err.querySelector('#dl').onclick = (ev)=>{
      ev.preventDefault();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));
      a.download = 'nxt-internship-debrief.json'; a.click();
    };
  }
}

/* ================= CONFETTI ================= */
function confettiBurst(){
  const cv = document.getElementById('confetti');
  const ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ['#0ea5e9','#8b5cf6','#ec4899','#10b981','#f59e0b'];
  const parts = Array.from({length:120},()=>({
    x: innerWidth/2 + (Math.random()-.5)*200, y: innerHeight*0.35,
    vx:(Math.random()-.5)*14, vy:-Math.random()*14-4,
    s: Math.random()*7+4, c: colors[Math.floor(Math.random()*colors.length)],
    r: Math.random()*Math.PI, vr:(Math.random()-.5)*.3, life: 1
  }));
  let frame = 0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=.35; p.r+=p.vr; p.life-=.008;
      ctx.save(); ctx.globalAlpha=Math.max(0,p.life); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); ctx.restore();
    });
    if(++frame<160) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* migrate old saved state that stored an emoji avatar */
if(S.avatar && !ICONS[S.avatar]) delete S.avatar;

render();
